<div class="replay-page">
    <div class="replay-header">
        <button class="back-btn" (click)="goBack()">{{ 'history.backToHistory' | translate }}</button>
        <h2>{{ 'history.replayTitle' | translate }}</h2>
        @if (record(); as rec) {
        <span class="replay-date">{{ rec.createdAt | date:'yyyy/MM/dd HH:mm' }}</span>
        }
    </div>

    @if (loading()) {
    <div class="loading">Loading...</div>
    } @else if (!record()) {
    <div class="not-found">Record not found.</div>
    } @else {
    <div class="replay-content">
        @if (replayedState(); as state) {
        <app-game-board [state]="state" [isReplay]="true"></app-game-board>
        }
    </div>
    }
</div>
